name: Flutter CI/CD

on:
  push:
    branches: [ "main", "feat/ann-batch-optimization" ]
    paths:
      - 'glucosafe/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'glucosafe/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glucosafe

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: glucosafe/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: glucosafe/build/app/outputs/bundle/release/app-release.aab